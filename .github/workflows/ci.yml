name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build LegalAiLab.sln --nologo
      - run: dotnet format LegalAiLab.sln --verify-no-changes --no-restore -v q
      - run: dotnet test LegalAiLab.sln --nologo --no-build
